name: Publish

# On a v* tag, test + build the package and stage it on npm with provenance.
#
# Auth is tokenless via npm Trusted Publishing (OIDC): no NPM_TOKEN secret. It
# needs `id-token: write`, npm >= 11.15.0, and a trusted publisher registered
# for @re-cinq/eslint-plugin-re-lint on npmjs.com pointing at this repo and this
# workflow file. The first-ever publish is done once with a token before the
# trusted publisher can be registered.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; `npm stage` needs >= 11.15.0.
      - name: Upgrade npm for OIDC trusted publishing and staged publishing
        run: npm install -g npm@11.19.1
      - name: Package version matches the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-version.sh "$TAG"
      - run: npm ci --ignore-scripts
      - run: npm test
      # Staged, not direct: the trusted publisher allows `npm stage publish`
      # only, which is npm's own recommendation. The tarball, its dist-tag and
      # its provenance all reach the registry, but the version is not
      # installable until a maintainer approves the stage with 2FA - on
      # npmjs.com (the package page's Versions tab -> Approve) or with
      # `npm stage list` then `npm stage approve <id>`. Nothing this job can do
      # makes a version installable on its own. pipefail: a failed stage must
      # not be masked by the tee that feeds the job summary.
      - name: Stage the version on npm
        run: |
          set -o pipefail
          npm stage publish --access public --provenance 2>&1 | tee stage.log
          {
            echo "## Staged on npm - a maintainer must approve it before it is installable"
            echo
            echo "npmjs.com -> @re-cinq/eslint-plugin-re-lint -> Versions tab -> Approve (2FA), or: npm stage list, then npm stage approve <id>."
            echo
            echo '```'
            cat stage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
