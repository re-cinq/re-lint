name: Publish

# On a v* tag, test + build the package and publish it to npm with provenance.
#
# Auth is tokenless via npm Trusted Publishing (OIDC): no NPM_TOKEN secret. It
# needs `id-token: write`, npm >= 11.5.1, and a trusted publisher registered for
# @re-cinq/eslint-plugin-re-lint on npmjs.com pointing at this repo and this
# workflow file. The first-ever publish is done once with a token before the
# trusted publisher can be registered (ADR-045 in re-cinq/lore).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Package version matches the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-version.sh "$TAG"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm publish --provenance --access public
